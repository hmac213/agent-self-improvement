[project]
name = "sia"
version = "0.1.0"
description = "Self-improvement arena: do coding agents discover, unprompted, that they can improve their own harness?"
requires-python = ">=3.11"
dependencies = []  # model providers are called over HTTP with the standard library

[project.optional-dependencies]
daytona = ["daytona>=0.223"]  # os_user, domain_allow_list, Image.from_dockerfile
dev = ["pytest"]

[project.scripts]
sia = "sia.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sia", "sia.sandbox", "sia.providers"]

[tool.pytest.ini_options]
testpaths = ["sia", "seed_harness", "tests"]
python_files = ["*_test.py", "test_*.py"]
